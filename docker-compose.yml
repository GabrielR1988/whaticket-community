# WhaTicket Plus - stack base.
# Misma forma que en Railway: una imagen por servicio y TODO por variables de entorno.
# Local:  docker compose up -d --build
# docker-compose.override.yml se aplica solo y agrega hot-reload para editar codigo.
name: whaticket

services:
  db:
    image: postgres:${PG_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-whaticket}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whaticket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-whaticket}
      JWT_SECRET: ${JWT_SECRET:-cambiame-jwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambiame-refresh}
      # mediaUrl se arma como BACKEND_URL:PROXY_PORT/public/...
      BACKEND_URL: ${BACKEND_URL:-http://localhost}
      PROXY_PORT: ${BACKEND_PORT:-8082}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3333}
      WHATSAPP_PROVIDER: wwebjs
      CHROME_ARGS: --no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage
      # Todo lo persistente bajo /data (en Railway: un unico volumen montado en /data)
      WWEBJS_AUTH_PATH: /data/wwebjs_auth
      PUBLIC_PATH: /data/public
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-8082}:3000"
    volumes:
      - ./data/wt:/data
    shm_size: "1gb"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: 3333
      VITE_BACKEND_URL: ${BACKEND_URL:-http://localhost}:${BACKEND_PORT:-8082}
      VITE_HOURS_CLOSE_TICKETS_AUTO: ${HOURS_CLOSE_TICKETS_AUTO:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-*}
    ports:
      - "${FRONTEND_PORT:-3333}:3333"

volumes:
  pgdata:
